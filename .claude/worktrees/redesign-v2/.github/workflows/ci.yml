name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint lint --strict --reporter github-actions-logging || true
          # SwiftLint warnings don't fail the build

  swiftformat:
    name: SwiftFormat
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting
        run: |
          swiftformat --lint . 2>&1 || true
          # SwiftFormat warnings don't fail the build

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS
        run: |
          xcodebuild -scheme GrowWise -configuration Debug build \
            CODE_SIGN_IDENTITY='-' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            | xcbeautify || xcodebuild -scheme GrowWise -configuration Debug build \
            CODE_SIGN_IDENTITY='-' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -destination 'platform=iOS Simulator,name=iPhone 16'

  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild test -scheme GrowWise -configuration Debug \
            CODE_SIGN_IDENTITY='-' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            | xcbeautify || xcodebuild test -scheme GrowWise -configuration Debug \
            CODE_SIGN_IDENTITY='-' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -destination 'platform=iOS Simulator,name=iPhone 16'