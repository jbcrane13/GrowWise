name: Validate AGENTS.md

on:
  push:
    paths:
      - "AGENTS.md"
      - "GrowWisePackage/**"
      - "GrowWise/**"
      - "docs/**"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/validate-agents-md.yml"
      - "scripts/validate-agents-md.sh"
  pull_request:
    paths:
      - "AGENTS.md"
      - "GrowWisePackage/**"
      - "GrowWise/**"
      - "docs/**"
      - ".swiftlint.yml"
      - ".swiftformat"

jobs:
  validate-references:
    name: Validate AGENTS.md References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate file paths and references
        run: ./scripts/validate-agents-md.sh

      - name: Post validation summary
        if: always()
        run: |
          echo "## AGENTS.md Validation" >> $GITHUB_STEP_SUMMARY
          ./scripts/validate-agents-md.sh >> $GITHUB_STEP_SUMMARY 2>&1 || true

  validate-commands:
    name: Validate AGENTS.md Commands
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validate build command from AGENTS.md
        run: |
          echo "Validating: xcodebuild -workspace GrowWise.xcworkspace -scheme GrowWise -sdk iphonesimulator build"
          xcodebuild \
            -workspace GrowWise.xcworkspace \
            -scheme GrowWise \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -5

      - name: Validate test command from AGENTS.md
        run: |
          echo "Validating: cd GrowWisePackage && swift test"
          cd GrowWisePackage
          swift test --list-tests | head -10
          echo "Test listing succeeded — AGENTS.md test command is valid"

  check-freshness:
    name: Check AGENTS.md Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AGENTS.md is not stale
        run: |
          LAST_MODIFIED=$(git log -1 --format="%ct" -- AGENTS.md)
          NOW=$(date +%s)
          DAYS_OLD=$(( (NOW - LAST_MODIFIED) / 86400 ))

          echo "AGENTS.md was last modified ${DAYS_OLD} days ago."

          if [ "$DAYS_OLD" -gt 30 ]; then
            echo "WARNING: AGENTS.md is ${DAYS_OLD} days old. Consider reviewing for accuracy."
            echo "## AGENTS.md Freshness Warning" >> $GITHUB_STEP_SUMMARY
            echo "AGENTS.md was last updated ${DAYS_OLD} days ago. Review for accuracy." >> $GITHUB_STEP_SUMMARY
          else
            echo "AGENTS.md is up to date (${DAYS_OLD} days old)."
            echo "## AGENTS.md Freshness" >> $GITHUB_STEP_SUMMARY
            echo "Last updated ${DAYS_OLD} days ago." >> $GITHUB_STEP_SUMMARY
          fi
