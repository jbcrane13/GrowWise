# SonarCloud configuration for GrowWise iOS project
# https://sonarcloud.io

sonar.projectKey=growwise_cultivation
sonar.organization=growwise

sonar.projectName=GrowWise (Cultivation)
sonar.projectVersion=1.0

# Source directories
sonar.sources=GrowWise,GrowWisePackage/Sources
sonar.tests=GrowWisePackage/Tests,GrowWiseUITests

# Language
sonar.language=swift

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  **/build/**,\
  **/.build/**,\
  **/Pods/**,\
  **/*.json,\
  **/*.md,\
  **/GrowWise.xcodeproj/**,\
  **/GrowWise.xcworkspace/**,\
  **/xcuserdata/**

sonar.test.exclusions=\
  **/build/**,\
  **/.build/**

# Swift-specific: use SwiftLint report if available
sonar.swift.swiftlint.reportPaths=swiftlint-report.json

# Coverage report (generated by swift test --enable-code-coverage)
sonar.coverageReportPaths=coverage.xml
